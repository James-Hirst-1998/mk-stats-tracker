<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MK replay</title>
<link rel="stylesheet" href="/style.css">
<style>
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            margin: 8px 0; }
.controls input[type="range"] { flex: 1; min-width: 160px;
                                accent-color: var(--blue); }
.jumps { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.stage { display: flex; gap: 16px; flex-wrap: wrap; }
.trackbox { flex: 1; min-width: 320px; }
.board { width: 200px; flex-shrink: 0; font-size: 13px; }
.board .row { display: flex; gap: 7px; align-items: center; padding: 3px 0;
              border-top: 1px solid var(--line); }
.board .row.tracked { font-weight: 700; }
.board .pos { color: var(--ink-3); width: 18px; }
.board .gap { color: var(--ink-3); font-family: ui-monospace, monospace;
              font-size: 11px; margin-left: auto; }
.ticker { font-size: 13.5px; color: var(--ink-2); min-height: 22px;
          margin-top: 6px; }
.ticker .t { font-family: ui-monospace, monospace; font-size: 12px;
             color: var(--ink-3); margin-right: 6px; }
.clock { font-family: ui-monospace, monospace; font-size: 13px;
         color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1 id="title">Replay</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer"></span>
    <span class="clock" id="lapclock"></span>
    <a class="replaylink" id="back" href="/">← Dashboard</a>
  </div>
  <div class="card">
    <div class="controls">
      <button class="btn" id="play" style="width:44px">▶</button>
      <input type="range" id="scrub" min="0" max="100" step="0.1" value="0">
      <select id="speed"><option value="1">1×</option><option value="2">2×</option>
        <option value="4" selected>4×</option><option value="8">8×</option></select>
    </div>
    <div class="jumps" id="jumps"></div>
    <div class="stage">
      <div class="trackbox">
        <svg id="stage" viewBox="0 0 500 400" style="width:100%;display:block">
          <path id="trk" d="M 100 330 C 190 350, 320 350, 390 330 C 450 312, 465 262, 442 222 C 424 190, 372 194, 352 168 C 334 144, 358 118, 392 106 C 426 94, 436 60, 402 50 C 366 40, 316 70, 268 74 C 220 78, 196 44, 148 50 C 104 56, 82 96, 98 132 C 112 164, 152 172, 148 204 C 144 234, 92 232, 62 256 C 28 284, 40 316, 100 330 Z"
                fill="none" stroke="#e9ecef" stroke-width="20" stroke-linejoin="round"/>
          <path id="trkline" d="" fill="none" stroke="#adb5bd" stroke-width="1" stroke-dasharray="5 6"/>
          <line id="startline" stroke="#868e96" stroke-width="2"/>
          <g id="karts"></g>
          <text id="tracknote" x="496" y="396" font-size="11" fill="#868e96" text-anchor="end"></text>
        </svg>
        <div class="ticker" id="ticker"></div>
      </div>
      <div class="board">
        <div class="muted" style="margin-bottom:6px">Live order</div>
        <div id="board"></div>
      </div>
    </div>
  </div>
  <footer>Order and gaps come from each kart's recorded progress; gaps are
  rough seconds at this race's median lap time. The ticker is generated by
  fixed rules from the race log.</footer>
</div>
<script src="/replay.js"></script>
</body>
</html>
